<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio  - Navbar</title>
  <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/css/navbar.css">
  <link rel="stylesheet" href="../assets/icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/theme.css">
</head>
<body>

  <!-- Componente Navbar Superior: Studio play -->
  <nav class="navbar navbar-expand-lg navbar-studio sticky-top">
    <div class="container-fluid">
      <div class="d-flex align-items-center gap-3">
        <a class="navbar-brand d-flex flex-column align-items-center m-0 lh-1" href="../views/dashboard.html#todos" target="_top">
          <img src="../assets/imagenes/logo.jpg" alt="Logo Studio play" class="brand-logo">
          <span class="brand-title">Studio play</span>
        </a>
      </div>

      <div class="d-flex align-items-center gap-3 ms-auto">
        <div class="d-flex align-items-center gap-2" id="loggedInSection">
          <div class="dropdown">
            <a href="#" class="user-profile-btn dropdown-toggle" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
              <img src="../assets/imagenes/user.jpg" alt="Usuario Studio play" class="user-avatar">
              <span class="small fw-semibold d-none d-sm-inline" id="navbarUserName">Mi Cuenta</span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0 mt-2" aria-labelledby="userDropdown">
              <li class="px-3 py-2 border-bottom">
                <div class="d-flex align-items-center gap-2">
                  <img src="../assets/imagenes/user.jpg" alt="Usuario" class="user-avatar">
                  <div>
                    <div class="fw-bold small" id="dropdownUserTitle">Usuario Studio</div>
                    <div class="text-muted fs-sm" id="dropdownUserEmail">usuario@studioplay.com</div>
                  </div>
                </div>
              </li>
              <li><a class="dropdown-item small py-2" href="../views/useradmin.html" target="_top"><i class="bi bi-person me-2"></i>Mi perfil</a></li>
              <li><a class="dropdown-item small py-2" href="../views/dashboard.html#config-password" target="_top"><i class="bi bi-gear me-2"></i>Configuración</a></li>
              <li><hr class="dropdown-divider"></li>
              <li>
                <button type="button" class="dropdown-item small py-2 text-danger" id="dropdownLogoutBtn">
                  <i class="bi bi-box-arrow-right me-2"></i>Cerrar sesión
                </button>
              </li>
            </ul>
          </div>

          <button type="button" class="btn btn-outline-dark btn-sm px-3" id="navLogoutBtn">
            <i class="bi bi-box-arrow-right me-1"></i>Cerrar sesión
          </button>
        </div>

        <div class="d-none" id="loggedOutSection">
          <button type="button" class="btn btn-dark btn-sm px-3" id="navbarLoginButton">
            <i class="bi bi-box-arrow-in-right me-1"></i>Iniciar sesión
          </button>
        </div>
      </div>
    </div>
  </nav>

  <script src="../assets/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/session.js"></script>
  <script>
    const loggedInSection = document.getElementById('loggedInSection');
    const loggedOutSection = document.getElementById('loggedOutSection');
    const userDropdown = document.getElementById('userDropdown');
    const isEmbedded = window.parent !== window;

    function notificarPadre(data) {
      if (isEmbedded) window.parent.postMessage(data, '*');
    }

    // ---------- Sesión compartida ----------
    function renderSesion() {
      const sesion = StudioSession.get();
      const nombre = StudioSession.displayName(sesion);
      document.getElementById('navbarUserName').textContent = nombre;
      document.getElementById('dropdownUserTitle').textContent = nombre;
      document.getElementById('dropdownUserEmail').textContent = sesion.email || 'usuario@studioplay.com';
      loggedInSection.classList.toggle('d-none', !sesion.loggedIn);
      loggedOutSection.classList.toggle('d-none', sesion.loggedIn);
    }

    function cerrarSesion() {
      bootstrap.Dropdown.getOrCreateInstance(userDropdown).hide();
      const sesion = StudioSession.logout();
      renderSesion();
      notificarPadre({ type: 'navbar-session-changed', session: sesion });
    }

    document.getElementById('navLogoutBtn').addEventListener('click', cerrarSesion);
    document.getElementById('dropdownLogoutBtn').addEventListener('click', cerrarSesion);

    // ---------- Login ----------
    // El modal de inicio de sesión vive en la página contenedora (en el iframe quedaría recortado)
    document.getElementById('navbarLoginButton').addEventListener('click', function () {
      notificarPadre({ type: 'navbar-login-request' });
    });

    // ---------- Menú desplegable dentro de un iframe ----------
    // El iframe mide lo mismo que el navbar, así que pedimos a la página
    // contenedora que lo agrande mientras el menú está abierto.
    userDropdown.addEventListener('show.bs.dropdown', function () {
      notificarPadre({ type: 'navbar-dropdown', open: true });
    });

    userDropdown.addEventListener('hidden.bs.dropdown', function () {
      notificarPadre({ type: 'navbar-dropdown', open: false });
    });

    // ---------- Mensajes de la página contenedora ----------
    window.addEventListener('message', function (event) {
      if (event.source !== window.parent || !event.data || typeof event.data !== 'object') return;
      if (event.data.type === 'navbar-session-changed') {
        // La página contenedora envía la sesión: así no dependemos de que compartan almacenamiento
        if (event.data.session) StudioSession.set(event.data.session);
        renderSesion();
      }
    });

    window.addEventListener('storage', function (event) {
      if (event.key === StudioSession.KEY) renderSesion();
    });

    renderSesion();
  </script>
</body>
</html>
