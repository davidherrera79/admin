<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio play - Navbar</title>
  <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/css/navbar.css">
  <link rel="stylesheet" href="../../node_modules/bootstrap-icons/font/bootstrap-icons.min.css">
</head>
<body>

  <!-- Componente Navbar Superior: Studio play -->
  <nav class="navbar navbar-expand-lg navbar-studio sticky-top">
    <div class="container-fluid">
      <div class="d-flex align-items-center gap-3">
        <button type="button" class="btn btn-outline-dark btn-sm px-2 py-1" id="navbarSidebarToggle" title="Retraer / Expandir Sidebar">
          <i class="bi bi-layout-sidebar-inset"></i>
        </button>
        <a class="navbar-brand d-flex flex-column align-items-center m-0 lh-1" href="../views/dashboard.html" target="_top">
          <img src="../assets/imagenes/logo.jpg" alt="Logo Studio play" class="brand-logo">
          <span class="brand-title">Studio play</span>
        </a>
      </div>

      <div class="d-flex align-items-center gap-3 ms-auto">
        <div class="d-flex align-items-center gap-2" id="loggedInSection">
          <div class="dropdown">
            <a href="#" class="user-profile-btn dropdown-toggle" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
              <img src="../assets/imagenes/user.jpg" alt="Usuario Studio play" class="user-avatar">
              <span class="small fw-semibold d-none d-sm-inline" id="navbarUserName">Mi Cuenta</span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0 mt-2" aria-labelledby="userDropdown">
              <li class="px-3 py-2 border-bottom">
                <div class="d-flex align-items-center gap-2">
                  <img src="../assets/imagenes/user.jpg" alt="Usuario" class="user-avatar">
                  <div>
                    <div class="fw-bold small" id="dropdownUserTitle">Usuario Studio</div>
                    <div class="text-muted" style="font-size: 0.75rem;" id="dropdownUserEmail">usuario@studioplay.com</div>
                  </div>
                </div>
              </li>
              <li><a class="dropdown-item small py-2" href="../views/dashboard.html#usuario-admin" target="_top"><i class="bi bi-person me-2"></i>Mi perfil</a></li>
              <li><a class="dropdown-item small py-2" href="../views/dashboard.html#config-password" target="_top"><i class="bi bi-gear me-2"></i>Configuración</a></li>
              <li><hr class="dropdown-divider"></li>
              <li>
                <button type="button" class="dropdown-item small py-2 text-danger" id="dropdownLogoutBtn">
                  <i class="bi bi-box-arrow-right me-2"></i>Cerrar sesión
                </button>
              </li>
            </ul>
          </div>

          <button type="button" class="btn btn-outline-dark btn-sm px-3" id="navLogoutBtn">
            <i class="bi bi-box-arrow-right me-1"></i>Cerrar sesión
          </button>
        </div>

        <div class="d-none" id="loggedOutSection">
          <button type="button" class="btn btn-dark btn-sm px-3" id="navbarLoginButton" data-bs-toggle="modal" data-bs-target="#loginModal">
            <i class="bi bi-box-arrow-in-right me-1"></i>Iniciar sesión
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Modal de Login -->
  <div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow">
        <div class="modal-header border-0 pb-0">
          <div class="d-flex align-items-center gap-2">
            <img src="../assets/imagenes/logo.jpg" alt="Studio play" class="modal-brand-logo">
            <h5 class="modal-title fw-bold" id="loginModalLabel">Iniciar Sesión - Studio play</h5>
          </div>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body pt-3">
          <div class="text-center mb-3">
            <img src="../assets/imagenes/user.jpg" alt="Usuario" class="rounded-circle border mb-2" style="width: 68px; height: 68px; object-fit: cover;">
            <p class="text-muted small mb-0">Ingresa tus credenciales para acceder a tu cuenta</p>
          </div>
          <form id="modalLoginForm">
            <div class="mb-3">
              <label for="modalEmail" class="form-label small fw-semibold">Correo electrónico</label>
              <input type="email" class="form-control" id="modalEmail" placeholder="usuario@studioplay.com" required>
            </div>
            <div class="mb-3">
              <label for="modalPassword" class="form-label small fw-semibold">Contraseña</label>
              <input type="password" class="form-control" id="modalPassword" placeholder="••••••••" required>
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-studio">Iniciar Sesión</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="../assets/js/bootstrap.bundle.min.js"></script>
  <script>
    const loggedInSection = document.getElementById('loggedInSection');
    const loggedOutSection = document.getElementById('loggedOutSection');
    const navLogoutBtn = document.getElementById('navLogoutBtn');
    const dropdownLogoutBtn = document.getElementById('dropdownLogoutBtn');
    const modalLoginForm = document.getElementById('modalLoginForm');
    const loginModalEl = document.getElementById('loginModal');
    const navbarSidebarToggle = document.getElementById('navbarSidebarToggle');
    const navbarLoginButton = document.getElementById('navbarLoginButton');

    navbarSidebarToggle.addEventListener('click', function () {
      if (window.parent !== window) {
        window.parent.postMessage({ type: 'toggle-sidebar' }, '*');
      }
    });

    navbarLoginButton.addEventListener('click', function (event) {
      if (window.parent !== window) {
        event.preventDefault();
        event.stopPropagation();
        window.parent.postMessage({ type: 'navbar-login-request' }, '*');
      }
    });

    window.addEventListener('message', function (event) {
      if (event.source !== window.parent || !event.data || event.data.type !== 'navbar-login-success') return;

      const username = event.data.email.split('@')[0] || 'Mi Cuenta';
      document.getElementById('navbarUserName').textContent = username;
      document.getElementById('dropdownUserTitle').textContent = username;
      document.getElementById('dropdownUserEmail').textContent = event.data.email;
      loggedOutSection.classList.add('d-none');
      loggedInSection.classList.remove('d-none');
    });

    function cerrarSesion() {
      loggedInSection.classList.add('d-none');
      loggedOutSection.classList.remove('d-none');
    }

    navLogoutBtn.addEventListener('click', cerrarSesion);
    dropdownLogoutBtn.addEventListener('click', cerrarSesion);

    modalLoginForm.addEventListener('submit', function (event) {
      event.preventDefault();
      const email = document.getElementById('modalEmail').value;
      const username = email.split('@')[0] || 'Mi Cuenta';

      document.getElementById('navbarUserName').textContent = username;
      document.getElementById('dropdownUserTitle').textContent = username;
      document.getElementById('dropdownUserEmail').textContent = email;

      loggedOutSection.classList.add('d-none');
      loggedInSection.classList.remove('d-none');

      const modalInstance = bootstrap.Modal.getInstance(loginModalEl);
      if (modalInstance) modalInstance.hide();
    });
  </script>
</body>
</html>
