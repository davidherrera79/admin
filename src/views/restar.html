<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio play - Restar Usuarios</title>
  <!-- Estilos Bootstrap, Navbar, Sidebar y Dashboard -->
  <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/css/navbar.css">
  <link rel="stylesheet" href="../assets/css/sidebar.css">
  <link rel="stylesheet" href="../assets/css/dashboard.css">
  <link rel="stylesheet" href="../assets/icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/useradmin.css">
</head>
<body>

  <iframe
    src="../components/navbar.html"
    id="navbarFrame"
    title="Navbar Studio play"
    class="navbar-iframe">
  </iframe>

  <!-- =======================================================
       CONTENEDOR PRINCIPAL: SIDEBAR (IFRAME) + RESTAR USUARIOS
       ======================================================= -->
  <div class="workspace-shell">
    <!-- Iframe del Sidebar Retráctil -->
    <iframe
      src="../components/sidebar.html?section=usuario-restar"
      name="sidebarFrame"
      id="sidebarFrame"
      title="Sidebar Studio play"
      class="sidebar-iframe">
    </iframe>

    <!-- Contenido Principal de Restar Usuarios -->
    <main class="dashboard-main-scroll">
      <div class="dashboard-container container-fluid">

        <!-- Barra Superior -->
        <div class="dashboard-topbar d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
          <div class="d-flex align-items-center gap-2">
            <span class="stat-icon stat-icon-md tone-warning"><i class="bi bi-key-fill"></i></span>
            <div>
              <h1 class="h6 fw-bold mb-0">Restar Usuarios</h1>
              <div class="text-muted fs-xs">Asigna una contraseña nueva a un usuario del equipo</div>
            </div>
          </div>
        </div>

        <!-- Componente Restaurar Contraseña -->
        <div class="component-iframe-card mb-3" id="resetPasswordCard">
          <iframe
            src="../components/restaruser.html"
            id="frameRestarUser"
            name="frameRestarUser"
            class="component-frame frame-form-height"
            title="Restaurar contraseña">
          </iframe>
        </div>

        <!-- Componente Lista de Usuarios -->
        <div class="component-iframe-card mb-3" id="userListCard">
          <div class="module-header bg-white">
            <span class="fw-bold"><i class="bi bi-table me-1 text-primary"></i>Lista de Usuarios</span>
            <button type="button" class="btn btn-outline-dark btn-sm py-0 px-2 fs-xs" id="btnRefreshListFrame" title="Actualizar tabla">
              <i class="bi bi-arrow-repeat me-1"></i>Actualizar tabla
            </button>
          </div>
          <iframe
            src="../components/userlist.html"
            id="frameUserList"
            name="frameUserList"
            class="component-frame frame-list-height"
            title="Tabla de Usuarios">
          </iframe>
        </div>

      </div>
    </main>
  </div>

  <!-- Scripts de Bootstrap, Almacén de Usuarios y Sesión -->
  <script src="../assets/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/user-admin-store.js"></script>
  <script src="../assets/js/session.js"></script>
  <script>
    const navbarFrame = document.getElementById('navbarFrame');
    const sidebarFrame = document.getElementById('sidebarFrame');
    const frameUserList = document.getElementById('frameUserList');
    const frameRestarUser = document.getElementById('frameRestarUser');

    // Botón "Actualizar tabla": pide al iframe de la lista que se recargue
    document.getElementById('btnRefreshListFrame').addEventListener('click', function () {
      if (frameUserList.contentWindow) {
        frameUserList.contentWindow.postMessage({ type: 'studio-userlist-refresh' }, '*');
      }
    });

    // Aplicar el estado "fijado" del sidebar antes de que cargue el iframe
    try {
      if (window.localStorage.getItem('studioSidebarPinned') === '1') sidebarFrame.classList.add('pinned');
    } catch (e) { /* sin almacenamiento */ }

    window.addEventListener('message', function (event) {
      if (!event.data || typeof event.data !== 'object') return;

      const fromNavbar = event.source === navbarFrame.contentWindow;
      const fromSidebar = event.source === sidebarFrame.contentWindow;
      const fromUserList = event.source === frameUserList.contentWindow;
      const fromRestarUser = event.source === frameRestarUser.contentWindow;

      // "Editar" en la lista: elegir ese usuario en el formulario de restaurar contraseña
      if (event.data.type === 'studio-user-edit' && fromUserList && typeof event.data.id === 'string') {
        frameRestarUser.contentWindow.postMessage({ type: 'studio-password-reset-select', id: event.data.id }, '*');
        document.getElementById('resetPasswordCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
        return;
      }

      // "Nuevo usuario" se gestiona en la Administración de Usuarios
      if (event.data.type === 'studio-user-new' && fromUserList) {
        window.location.href = './useradmin.html';
        return;
      }

      // Contraseña restaurada: refrescar la tabla
      if (event.data.type === 'studio-password-reset' && fromRestarUser) {
        frameUserList.contentWindow.postMessage({ type: 'studio-userlist-refresh' }, '*');
        return;
      }

      // La tabla cambió usuarios (activar, eliminar…): recargar el selector del formulario
      if (event.data.type === 'studio-users-updated' && fromUserList) {
        frameRestarUser.contentWindow.postMessage({ type: 'studio-userlist-refresh' }, '*');
        return;
      }

      if (event.data.type === 'navbar-dropdown' && fromNavbar) {
        navbarFrame.classList.toggle('dropdown-open', Boolean(event.data.open));
        return;
      }

      if (event.data.type === 'navbar-session-changed' && fromNavbar) {
        if (event.data.session) StudioSession.set(event.data.session);
        return;
      }

      if (event.data.type === 'sidebar-state' && fromSidebar) {
        sidebarFrame.classList.toggle('pinned', Boolean(event.data.pinned));
        sidebarFrame.classList.toggle('peek', Boolean(event.data.peek));
        return;
      }

      if (event.data.type === 'navigate-section' && fromSidebar) {
        const sec = typeof event.data.section === 'string' ? event.data.section : 'todos';
        if (sec === 'usuario-restar') return; // Ya estamos aquí
        if (sec === 'usuario-admin') {
          window.location.href = './useradmin.html';
        } else {
          window.location.href = `./dashboard.html#${encodeURIComponent(sec)}`;
        }
      }
    });

    // Envía la sesión actual al navbar
    function enviarSesionAlNavbar() {
      navbarFrame.contentWindow.postMessage({ type: 'navbar-session-changed', session: StudioSession.get() }, '*');
    }

    navbarFrame.addEventListener('load', enviarSesionAlNavbar);
    enviarSesionAlNavbar();
  </script>
</body>
</html>
