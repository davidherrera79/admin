<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio play - Administración de Usuarios</title>
  <!-- Estilos Bootstrap, Navbar, Sidebar y Dashboard -->
  <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/css/navbar.css">
  <link rel="stylesheet" href="../assets/css/sidebar.css">
  <link rel="stylesheet" href="../assets/css/dashboard.css">
  <link rel="stylesheet" href="../assets/icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/useradmin.css">
</head>
<body>

  <iframe
    src="../components/navbar.html"
    id="navbarFrame"
    title="Navbar Studio play"
    class="navbar-iframe">
  </iframe>

  <!-- =======================================================
       CONTENEDOR PRINCIPAL: SIDEBAR (IFRAME) + USERADMIN
       ======================================================= -->
  <div class="workspace-shell">
    <!-- Iframe del Sidebar Retráctil -->
    <iframe
      src="../components/sidebar.html?section=usuario-admin"
      name="sidebarFrame"
      id="sidebarFrame"
      title="Sidebar Studio play"
      class="sidebar-iframe">
    </iframe>

    <!-- Contenido Principal de Administración de Usuarios -->
    <main class="dashboard-main-scroll">
      <div class="dashboard-container container-fluid">

        <!-- Barra Superior de Administración de Usuarios -->
        <div class="dashboard-topbar d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
          <div class="d-flex align-items-center gap-2">
            <span class="stat-icon stat-icon-md tone-brand"><i class="bi bi-shield-check"></i></span>
            <div>
              <h1 class="h6 fw-bold mb-0">Administración de Usuarios</h1>
              <div class="text-muted fs-xs">Registra, edita y gestiona el acceso del equipo</div>
            </div>
          </div>
          <div class="d-flex align-items-center gap-2">
            <span class="text-muted small d-none d-md-inline" id="activeFilterLabel"></span>
            <button type="button" class="btn btn-dark btn-sm" id="btnTopNewUser">
              <i class="bi bi-person-plus-fill me-1"></i>Nuevo usuario
            </button>
          </div>
        </div>

        <!-- FILA 1: 4 TARJETAS KPI DE USUARIOS EN TIEMPO REAL -->
        <div class="row g-3 mb-3">
          <div class="col-6 col-xl-3">
            <div class="card stat-card kpi kpi-filter h-100" role="button" tabindex="0" data-filter-status="" data-filter-role="" title="Ver todos los usuarios">
              <div class="stat-head">
                <span class="stat-label">Total usuarios</span>
                <div class="stat-icon tone-brand"><i class="bi bi-people-fill"></i></div>
              </div>
              <div class="stat-value" id="kpiTotalUsers">0</div>
              <div class="stat-foot"><span class="trend neutral"><i class="bi bi-list-ul"></i>Todos</span><span>registrados</span></div>
            </div>
          </div>

          <div class="col-6 col-xl-3">
            <div class="card stat-card kpi kpi-filter h-100" role="button" tabindex="0" data-filter-status="activo" data-filter-role="" title="Filtrar usuarios activos">
              <div class="stat-head">
                <span class="stat-label">Usuarios activos</span>
                <div class="stat-icon tone-success"><i class="bi bi-toggle-on"></i></div>
              </div>
              <div class="stat-value text-success" id="kpiActiveUsers">0</div>
              <div class="stat-foot"><span class="trend up" id="kpiActivePct">0%</span><span>del total</span></div>
            </div>
          </div>

          <div class="col-6 col-xl-3">
            <div class="card stat-card kpi kpi-filter h-100" role="button" tabindex="0" data-filter-status="inactivo" data-filter-role="" title="Filtrar usuarios inactivos">
              <div class="stat-head">
                <span class="stat-label">Usuarios inactivos</span>
                <div class="stat-icon tone-warning"><i class="bi bi-toggle-off"></i></div>
              </div>
              <div class="stat-value text-secondary" id="kpiInactiveUsers">0</div>
              <div class="stat-foot"><span class="trend neutral"><i class="bi bi-pause-circle"></i>Pausados</span><span>sin acceso</span></div>
            </div>
          </div>

          <div class="col-6 col-xl-3">
            <div class="card stat-card kpi kpi-filter h-100" role="button" tabindex="0" data-filter-status="" data-filter-role="Super Admin" title="Filtrar Super Admins">
              <div class="stat-head">
                <span class="stat-label">Super Admins</span>
                <div class="stat-icon tone-accent"><i class="bi bi-person-badge-fill"></i></div>
              </div>
              <div class="stat-value text-primary" id="kpiAdminUsers">0</div>
              <div class="stat-foot"><span class="trend neutral"><i class="bi bi-shield-lock"></i>Control total</span></div>
            </div>
          </div>
        </div>

        <div class="component-iframe-card mb-3" id="userListCard">
          <div class="module-header bg-white">
            <span class="fw-bold"><i class="bi bi-table me-1 text-primary"></i>Lista de Usuarios</span>
            <button type="button" class="btn btn-outline-dark btn-sm py-0 px-2 fs-xs" id="btnRefreshListFrame" title="Actualizar tabla">
              <i class="bi bi-arrow-repeat me-1"></i>Actualizar tabla
            </button>
          </div>
          <iframe
            src="../components/userlist.html#hideNewUserButton"
            id="frameUserList"
            name="frameUserList"
            class="component-frame frame-list-height"
            title="Tabla de Usuarios">
          </iframe>
        </div>

        <!-- Formulario: oculto hasta pulsar "Nuevo usuario" o "Editar" -->
        <div class="accordion d-none" id="userNewAccordion">
          <div class="accordion-item component-iframe-card">
            <div class="d-flex align-items-center">
              <h2 class="accordion-header flex-grow-1" id="userNewHeading">
                <button
                  class="accordion-button collapsed"
                  type="button"
                  data-bs-toggle="collapse"
                  data-bs-target="#userNewCollapse"
                  aria-expanded="false"
                  aria-controls="userNewCollapse">
                  <span id="userNewHeaderText"><i class="bi bi-person-plus-fill me-2 text-success"></i>Registrar usuario</span>
                </button>
              </h2>
              <button type="button" class="btn btn-outline-secondary btn-sm mx-2" id="btnCloseNewFrame" title="Cerrar formulario" aria-label="Cerrar formulario">
                <i class="bi bi-x-lg"></i>
              </button>
            </div>
            <div
              id="userNewCollapse"
              class="accordion-collapse collapse"
              aria-labelledby="userNewHeading"
              data-bs-parent="#userNewAccordion">
              <div class="accordion-body p-0">
                <iframe
                  src="../components/usernew.html"
                  id="frameUserNew"
                  name="frameUserNew"
                  class="component-frame frame-form-height"
                  title="Formulario de Registro de Usuarios">
                </iframe>
              </div>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <div class="modal fade" id="navbarLoginModal" tabindex="-1" aria-labelledby="navbarLoginModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow">
        <div class="modal-header border-0 pb-0">
          <div class="d-flex align-items-center gap-2">
            <img src="../assets/imagenes/logo.jpg" alt="Studio play" class="modal-brand-logo">
            <h2 class="modal-title h5 fw-bold" id="navbarLoginModalLabel">Iniciar Sesión - Studio play</h2>
          </div>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body pt-3">
          <form id="navbarLoginForm">
            <div class="mb-3">
              <label for="navbarLoginEmail" class="form-label small fw-semibold">Correo electrónico</label>
              <input type="email" class="form-control" id="navbarLoginEmail" autocomplete="email" required>
            </div>
            <div class="mb-3">
              <label for="navbarLoginPassword" class="form-label small fw-semibold">Contraseña</label>
              <input type="password" class="form-control" id="navbarLoginPassword" autocomplete="current-password" required>
            </div>
            <div class="alert alert-danger py-2 small d-none" id="loginError" role="alert"></div>
            <div class="d-grid">
              <button type="submit" class="btn btn-studio" id="loginSubmitBtn">Iniciar Sesión</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts de Bootstrap y Almacén de Usuarios -->
  <script src="../assets/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/user-admin-store.js"></script>
  <script src="../assets/js/session.js"></script>
  <script>
    const navbarFrame = document.getElementById('navbarFrame');
    const sidebarFrame = document.getElementById('sidebarFrame');
    const frameUserNew = document.getElementById('frameUserNew');
    const frameUserList = document.getElementById('frameUserList');
    const userNewAccordion = document.getElementById('userNewAccordion');
    const userNewCollapseEl = document.getElementById('userNewCollapse');
    const userNewCollapse = bootstrap.Collapse.getOrCreateInstance(userNewCollapseEl, { toggle: false });
    const navbarLoginModalEl = document.getElementById('navbarLoginModal');
    const navbarLoginModal = bootstrap.Modal.getOrCreateInstance(navbarLoginModalEl);
    const navbarLoginForm = document.getElementById('navbarLoginForm');

    const userNewHeaderText = document.getElementById('userNewHeaderText');
    const activeFilterLabel = document.getElementById('activeFilterLabel');
    const kpiCards = Array.from(document.querySelectorAll('.kpi-filter'));

    // Aplicar el estado "fijado" del sidebar antes de que cargue el iframe
    try {
      if (window.localStorage.getItem('studioSidebarPinned') === '1') sidebarFrame.classList.add('pinned');
    } catch (e) { /* sin almacenamiento */ }

    function actualizarKPIsUsuarios() {
      let users;
      try {
        users = StudioUserStore.getUsers();
      } catch (error) {
        console.error(error);
        return;
      }
      const total = users.length;
      const activos = users.filter(StudioUserStore.isActive).length;
      const inactivos = total - activos;
      const superAdmins = users.filter(StudioUserStore.isSuperAdmin).length;

      document.getElementById('kpiTotalUsers').textContent = total;
      document.getElementById('kpiActiveUsers').textContent = activos;
      document.getElementById('kpiInactiveUsers').textContent = inactivos;
      document.getElementById('kpiAdminUsers').textContent = superAdmins;
      document.getElementById('kpiActivePct').textContent = total ? `${Math.round((activos / total) * 100)}%` : '0%';
    }

    function refrescarLista() {
      if (frameUserList.contentWindow) {
        frameUserList.contentWindow.postMessage({ type: 'studio-userlist-refresh' }, '*');
      }
      actualizarKPIsUsuarios();
    }

    function setFormHeader(editId) {
      userNewHeaderText.replaceChildren();
      const icon = document.createElement('i');
      if (editId) {
        icon.className = 'bi bi-pencil-square me-2 text-primary';
        userNewHeaderText.append(icon, `Editar usuario ${editId}`);
      } else {
        icon.className = 'bi bi-person-plus-fill me-2 text-success';
        userNewHeaderText.append(icon, 'Registrar usuario');
      }
    }

    // Muestra el bloque del formulario debajo de la lista, desplegado
    function abrirFormularioUsuario(editId) {
      frameUserNew.src = editId
        ? `../components/usernew.html?id=${encodeURIComponent(editId)}`
        : '../components/usernew.html';
      setFormHeader(editId);
      userNewAccordion.classList.remove('d-none');
      userNewCollapse.show();
      setTimeout(() => userNewAccordion.scrollIntoView({ behavior: 'smooth', block: 'start' }), 200);
    }

    // Pliega el formulario; al terminar de plegarse se oculta el bloque entero
    function cerrarFormularioUsuario() {
      userNewCollapse.hide();
    }

    userNewCollapseEl.addEventListener('hidden.bs.collapse', function () {
      userNewAccordion.classList.add('d-none');
      setFormHeader(null);
      frameUserNew.src = '../components/usernew.html';
    });

    function aplicarFiltroKPI(card) {
      const status = card.dataset.filterStatus || '';
      const role = card.dataset.filterRole || '';
      const alreadyActive = card.classList.contains('kpi-active');
      const clear = alreadyActive || (!status && !role);

      kpiCards.forEach(c => c.classList.remove('kpi-active'));
      if (!clear) card.classList.add('kpi-active');

      frameUserList.contentWindow.postMessage({
        type: 'studio-userlist-filter',
        status: clear ? '' : status,
        role: clear ? '' : role
      }, '*');

      activeFilterLabel.textContent = clear ? '' : `Filtro: ${card.title.replace('Filtrar ', '')}`;
    }

    kpiCards.forEach(card => {
      card.addEventListener('click', () => aplicarFiltroKPI(card));
      card.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          aplicarFiltroKPI(card);
        }
      });
    });

    document.getElementById('btnTopNewUser').addEventListener('click', function () {
      abrirFormularioUsuario();
    });

    document.getElementById('btnCloseNewFrame').addEventListener('click', cerrarFormularioUsuario);

    document.getElementById('btnRefreshListFrame').addEventListener('click', refrescarLista);

    window.addEventListener('message', function (event) {
      if (!event.data || typeof event.data !== 'object') return;

      const fromNavbar = event.source === navbarFrame.contentWindow;
      const fromSidebar = event.source === sidebarFrame.contentWindow;
      const fromUserList = event.source === frameUserList.contentWindow;
      const fromUserNew = event.source === frameUserNew.contentWindow;

      if (event.data.type === 'navbar-login-request' && fromNavbar) {
        navbarLoginModal.show();
        return;
      }

      if (event.data.type === 'navbar-dropdown' && fromNavbar) {
        navbarFrame.classList.toggle('dropdown-open', Boolean(event.data.open));
        return;
      }

      if (event.data.type === 'navbar-session-changed' && fromNavbar) {
        if (event.data.session) StudioSession.set(event.data.session);
        return;
      }

      if (event.data.type === 'sidebar-state' && fromSidebar) {
        sidebarFrame.classList.toggle('pinned', Boolean(event.data.pinned));
        sidebarFrame.classList.toggle('peek', Boolean(event.data.peek));
        return;
      }

      if (event.data.type === 'navigate-section' && fromSidebar) {
        const sec = typeof event.data.section === 'string' ? event.data.section : 'todos';
        if (sec === 'usuario-admin') {
          // Ya estamos en la administración: llevar a la lista
          document.getElementById('userListCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
        } else if (sec === 'usuario-restar') {
          // "Restaurar contraseña" tiene su propia vista
          window.location.href = './restar.html';
        } else {
          window.location.href = `./dashboard.html#${encodeURIComponent(sec)}`;
        }
        return;
      }

      if (event.data.type === 'studio-userlist-filter-changed' && fromUserList) {
        const status = event.data.status || '';
        const role = event.data.role || '';
        const match = (status || role)
          ? kpiCards.find(c => (c.dataset.filterStatus || '') === status && (c.dataset.filterRole || '') === role)
          : null;
        kpiCards.forEach(c => c.classList.toggle('kpi-active', c === match));
        activeFilterLabel.textContent = match ? `Filtro: ${match.title.replace('Filtrar ', '')}` : '';
        return;
      }

      if (event.data.type === 'studio-user-edit' && fromUserList && typeof event.data.id === 'string') {
        abrirFormularioUsuario(event.data.id);
        return;
      }

      if (event.data.type === 'studio-user-new' && fromUserList) {
        abrirFormularioUsuario();
        return;
      }

      if (event.data.type === 'studio-users-updated' && (fromUserList || fromUserNew)) {
        if (fromUserList) {
          actualizarKPIsUsuarios();
        } else {
          refrescarLista();
        }
        return;
      }

      if (event.data.type === 'studio-user-saved' && fromUserNew) {
        // El formulario vuelve a modo "nuevo" tras guardar
        setFormHeader(null);
        refrescarLista();
        return;
      }

      if (event.data.type === 'studio-user-cancel' && fromUserNew) {
        cerrarFormularioUsuario();
        refrescarLista();
      }
    });

    // Envía la sesión actual al navbar (no depende de que compartan almacenamiento)
    function enviarSesionAlNavbar() {
      navbarFrame.contentWindow.postMessage({ type: 'navbar-session-changed', session: StudioSession.get() }, '*');
    }

    navbarFrame.addEventListener('load', enviarSesionAlNavbar);
    enviarSesionAlNavbar();

    // Inicio de sesión: valida email y contraseña contra los usuarios registrados
    const loginError = document.getElementById('loginError');
    const loginSubmitBtn = document.getElementById('loginSubmitBtn');

    navbarLoginForm.addEventListener('submit', async function (event) {
      event.preventDefault();
      if (!navbarLoginForm.reportValidity()) return;
      loginError.classList.add('d-none');
      loginSubmitBtn.disabled = true;
      try {
        const resultado = await StudioUserStore.authenticate(
          document.getElementById('navbarLoginEmail').value,
          document.getElementById('navbarLoginPassword').value
        );
        if (!resultado.ok) {
          loginError.textContent = resultado.error;
          loginError.classList.remove('d-none');
          document.getElementById('navbarLoginPassword').select();
          return;
        }
        StudioSession.login(resultado.user);
        navbarLoginForm.reset();
        navbarLoginModal.hide();
        enviarSesionAlNavbar();
      } catch (error) {
        loginError.textContent = error.message;
        loginError.classList.remove('d-none');
      } finally {
        loginSubmitBtn.disabled = false;
      }
    });

    navbarLoginModalEl.addEventListener('hidden.bs.modal', function () {
      loginError.classList.add('d-none');
      navbarLoginForm.reset();
    });

    window.addEventListener('storage', function (event) {
      if (event.key === 'studioPlayUsers') {
        actualizarKPIsUsuarios();
      }
    });

    actualizarKPIsUsuarios();
  </script>
</body>
</html>
